<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172033">
<meta name="description" content="پلنر شخصی برای نظم روزانه، عادت‌ها، برنامه هفتگی، اهداف و امور مالی">
<link rel="manifest" href="manifest.json">
<title>پلنر شخصی</title>
<style>
:root{color-scheme:light;--bg:#f3f5f8;--card:#fff;--text:#192335;--muted:#778196;--line:#e3e7ee;--accent:#157f78;--soft:#e2f4f0;--navy:#172033;--danger:#b64c3b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1000px;margin:auto;padding:14px;padding-bottom:36px}.hero{background:var(--navy);color:#fff;border-radius:18px;padding:22px;margin-bottom:14px}.eyebrow{font-size:11px;color:#b6c8d9;letter-spacing:1px}.hero h1{font-size:24px;margin:12px 0 7px}.hero p{font-size:12px;color:#bdc8d8;line-height:1.9;margin:0}.date{display:inline-block;margin-top:12px;border:1px solid #ffffff2c;padding:7px 10px;border-radius:9px;font-size:12px}.nav{display:flex;gap:7px;overflow:auto;padding:2px 0 12px;scrollbar-width:thin}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:10px 13px;border-radius:10px}.tab.active,.btn{background:var(--accent);color:#fff;border-color:var(--accent)}.tab.active{border:1px solid}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;min-width:0}.stat-label,.muted,label{color:var(--muted)}.stat-label{font-size:12px}.stat{font-size:24px;font-weight:700;margin:10px 0 4px;overflow-wrap:anywhere}.small{font-size:11px;color:var(--muted);line-height:1.9;overflow-wrap:anywhere}.section-title{font-size:16px;font-weight:700;margin:20px 0 10px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.progress{height:7px;background:var(--line);border-radius:20px;overflow:hidden;margin-top:10px}.progress span{display:block;height:100%;background:var(--accent);border-radius:20px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:600}.btn.secondary{background:var(--soft);color:var(--accent)}.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.btn.danger{background:#fff0ed;color:var(--danger)}.fullbtn{width:100%;margin-top:12px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field.full{grid-column:1/-1}label{font-size:12px}input,select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:9px;padding:11px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent)}.item{border:1px solid var(--line);border-radius:11px;padding:11px;margin-top:8px}.item-title{font-weight:600;line-height:1.8;overflow-wrap:anywhere}.pill{display:inline-block;background:var(--soft);color:var(--accent);font-size:10px;border-radius:20px;padding:4px 8px;white-space:nowrap}.check{width:19px;height:19px;accent-color:var(--accent);flex-shrink:0}.item.done .item-title{text-decoration:line-through;color:var(--muted)}.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:9px}.actions button{border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--muted);padding:7px 9px;font-size:11px}.empty{text-align:center;padding:23px 10px;color:var(--muted);font-size:12px;line-height:2}.hint{background:var(--soft);color:var(--accent);padding:12px;border-radius:11px;font-size:12px;line-height:1.9;margin-top:12px}.notice{font-size:12px;color:var(--accent);padding:8px 0;min-height:25px}.summaryline{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.summaryline:last-child{border:0}.foot{text-align:center;color:var(--muted);font-size:10px;padding:22px 0 8px;line-height:1.9}.install{display:none;margin-top:10px}.install.show{display:inline-block}.wide-grid{display:block}@media(min-width:650px){.app{padding:20px}.hero{padding:27px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.wide-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.section-title{margin-top:18px}}@media(max-width:360px){.app{padding:8px}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.hero h1{font-size:21px}}
</style>
</head>
<body>
<div class="app">
<header class="hero"><div class="eyebrow">PERSONAL OPERATING SYSTEM</div><h1>زندگی‌ات را آگاهانه مدیریت کن.</h1><p>کمتر پراکنده شو؛ روی کارهایی تمرکز کن که واقعاً اهمیت دارند.</p><div class="date" id="today"></div><button id="installBtn" class="btn install">نصب روی گوشی</button></header>
<nav class="nav" id="nav">
<button class="tab active" data-page="home">نمای کلی</button><button class="tab" data-page="tasks">کارهای روزانه</button><button class="tab" data-page="habits">عادت‌ها</button><button class="tab" data-page="week">برنامه هفتگی</button><button class="tab" data-page="money">امور مالی</button><button class="tab" data-page="goals">اهداف</button><button class="tab" data-page="review">مرور هفتگی</button><button class="tab" data-page="data">پشتیبان‌گیری</button>
</nav>
<main id="content"></main><div class="foot">قدم‌های کوچک، تکرار مداوم، پیشرفت واقعی.<br>اطلاعات در همین مرورگر ذخیره می‌شود؛ به‌صورت منظم پشتیبان بگیر.</div>
</div>
<script>
(()=>{
const $=s=>document.querySelector(s),todayISO=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({tasks:[],habits:[],weeks:[],money:[],goals:[],reviews:[]});let db=fresh(),page='home',filter='all',notice='';
const KEY='personal-planner-fa-v1';
try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(x)db={...fresh(),...x}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));notice='تغییرات ذخیره شد.'}catch(e){notice='ذخیره خودکار در دسترس نیست؛ از پشتیبان‌گیری استفاده کن.'}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),money=n=>Number(n||0).toLocaleString('fa-IR',{maximumFractionDigits:0});
const jalali=()=>{try{return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(new Date())}catch(e){return new Date().toLocaleDateString()}};
$('#today').textContent=jalali()+' · '+todayISO();
const status=v=>v==='done'?'انجام شد':v==='doing'?'در حال انجام':v==='cancel'?'لغو شد':'شروع نشده';
const badge=s=>`<span class="pill">${esc(s)}</span>`,empty=t=>`<div class="empty">${esc(t)}<br>با دکمه افزودن، اولین موردت را ثبت کن.</div>`;
const field=(label,name,type='text',o={})=>`<div class="field ${o.full?'full':''}"><label for="f-${name}">${label}</label>${type==='select'?`<select id="f-${name}" name="${name}">${o.options.map(a=>`<option value="${esc(a[0])}">${esc(a[1])}</option>`).join('')}</select>`:type==='textarea'?`<textarea id="f-${name}" name="${name}" rows="2" placeholder="${esc(o.placeholder||'')}"></textarea>`:`<input id="f-${name}" name="${name}" type="${type}" ${o.required?'required':''} ${o.min!==undefined?`min="${o.min}"`:''} ${o.step?`step="${o.step}"`:''} ${o.value!==undefined?`value="${esc(o.value)}"`:''} ${o.placeholder?`placeholder="${esc(o.placeholder)}"`:''}>`}</div>`;
const form=(id,title,fields,btn='ثبت اطلاعات')=>`<section class="card"><div class="section-title" style="margin-top:0">${title}</div><form id="${id}"><div class="form">${fields}</div><button class="btn fullbtn" type="submit">${btn}</button></form></section>`;
const stat=(a,b,c)=>`<div class="card"><div class="stat-label">${a}</div><div class="stat">${b}</div><div class="small">${c}</div></div>`;
function taskItems(list){if(!list.length)return empty('هنوز کاری ثبت نشده است.');return list.map(t=>`<div class="item ${t.status==='done'?'done':''}"><div class="row"><label style="display:flex;align-items:center;gap:9px;min-width:0;color:var(--text)"><input class="check" type="checkbox" data-task-check="${t.id}" ${t.status==='done'?'checked':''}><span class="item-title">${esc(t.title)}</span></label>${badge(t.priority||'متوسط')}</div><div class="small" style="margin-top:7px">${esc(t.date||'بدون تاریخ')} · ${esc(t.area||'شخصی')} · ${status(t.status)}</div>${t.note?`<div class="small">${esc(t.note)}</div>`:''}<div class="actions"><button data-task-edit="${t.id}">ویرایش</button><button data-task-delete="${t.id}">حذف</button></div></div>`).join('')}
function home(){let ts=db.tasks.filter(t=>t.date===todayISO()),done=ts.filter(t=>t.status==='done').length,hs=db.habits.filter(h=>h.date===todayISO()),hd=hs.filter(h=>h.done).length,inc=db.money.filter(m=>m.type==='in').reduce((a,m)=>a+m.amount,0),out=db.money.filter(m=>m.type==='out').reduce((a,m)=>a+m.amount,0),pct=ts.length?Math.round(done/ts.length*100):0;return `<div class="grid">${stat('کارهای امروز',`${done} / ${ts.length}`,'کارهای تکمیل‌شده')}${stat('عادت‌های امروز',`${hd} / ${hs.length}`,'عادت‌های انجام‌شده')}${stat('درآمد ثبت‌شده',money(inc),'همه تراکنش‌ها')}${stat('هزینه ثبت‌شده',money(out),'همه تراکنش‌ها')}</div><div class="card" style="margin-top:12px"><div class="row"><strong>پیشرفت کارهای امروز</strong><strong>${pct}٪</strong></div><div class="progress"><span style="width:${pct}%"></span></div><div class="small" style="margin-top:8px">مانده خالص: ${money(inc-out)} · مبالغ را با یک واحد پول ثابت ثبت کن.</div></div><div class="wide-grid"><section><div class="section-title">اولویت‌های امروز</div><div class="card">${taskItems(ts.filter(t=>t.priority==='بالا'&&t.status!=='done').slice(0,5))}<button class="btn secondary fullbtn" data-go="tasks">مدیریت همه کارها</button></div></section><section><div class="section-title">عادت‌های امروز</div><div class="card">${hs.length?hs.map(h=>`<div class="summaryline"><span>${esc(h.name)}</span><label><input class="check" type="checkbox" data-habit-check="${h.id}" ${h.done?'checked':''}></label></div>`).join(''):empty('هنوز عادت امروز را ثبت نکرده‌ای.')}<button class="btn secondary fullbtn" data-go="habits">مدیریت عادت‌ها</button></div></section></div><div class="hint">قاعده امروز: سه کار مهم را مشخص کن، بین آن‌ها زمان استراحت بگذار و پایان روز یک نکته برای بهتر شدن فردا بنویس.</div>`}
function tasksPage(){let list=db.tasks.filter(t=>filter==='all'||(filter==='today'?t.date===todayISO():t.status===filter));return `<div class="row"><div class="section-title" style="margin:0 0 10px">فهرست کارها</div><select id="task-filter" style="width:auto"><option value="all">همه کارها</option><option value="today">فقط امروز</option><option value="todo">شروع نشده</option><option value="doing">در حال انجام</option><option value="done">انجام‌شده‌ها</option></select></div><div class="card">${taskItems(list)}</div><div style="height:12px"></div>${form('task-form','افزودن کار جدید',field('عنوان کار','title','text',{required:true,placeholder:'مثلاً ۲۰ دقیقه مطالعه'})+field('تاریخ','date','date',{value:todayISO(),required:true})+field('حوزه','area','select',{options:[['شخصی','شخصی'],['کار','کار'],['سلامت','سلامت'],['یادگیری','یادگیری'],['خانواده','خانواده'],['مالی','مالی'],['متفرقه','متفرقه']]})+field('اولویت','priority','select',{options:[['بالا','بالا'],['متوسط','متوسط'],['پایین','پایین']]})+field('وضعیت','status','select',{options:[['todo','شروع نشده'],['doing','در حال انجام'],['done','انجام شد'],['cancel','لغو شد']]})+field('یادداشت','note','textarea',{full:true,placeholder:'جزئیات دلخواه'}))}`}
function habitsPage(){let hs=db.habits.filter(h=>h.date===todayISO());return `<div class="card"><div class="row"><strong>عادت‌های امروز</strong>${badge(hs.filter(h=>h.done).length+' از '+hs.length)}</div>${hs.length?hs.map(h=>`<div class="item"><div class="row"><label style="display:flex;gap:8px;align-items:center;color:var(--text)"><input class="check" type="checkbox" data-habit-check="${h.id}" ${h.done?'checked':''}><span>${esc(h.name)}</span></label><button class="btn danger" style="padding:7px 9px" data-habit-delete="${h.id}">حذف</button></div>${h.target?`<div class="small">هدف: ${esc(h.target)}</div>`:''}</div>`).join(''):empty('هنوز عادت روزانه‌ای ثبت نکرده‌ای.')}</div><div style="height:12px"></div>${form('habit-form','ثبت عادت برای امروز',field('نام عادت','name','text',{required:true,placeholder:'مطالعه، ورزش، خواب منظم...'})+field('تکرار / هدف','target','text',{placeholder:'مثلاً ۲۰ دقیقه'})+field('یادداشت','note','textarea',{full:true}),'افزودن عادت امروز')}<div class="hint">برای پیگیری عادت در روزهای بعد، رکورد روز جدید بساز. در نسخه بعد می‌توان الگوی تکرار خودکار اضافه کرد.</div>`}
function weekPage(){return `<div class="card"><div class="section-title" style="margin-top:0">برنامه هفته</div>${db.weeks.length?db.weeks.slice().reverse().map(w=>`<div class="item"><div class="row"><strong>${esc(w.day)} · ${esc(w.focus)}</strong>${badge(w.status)}</div><div class="small">${esc(w.result||'')}</div><div class="actions"><button data-week-delete="${w.id}">حذف</button></div></div>`).join(''):empty('نتیجه‌های مهم هفته را ثبت کن.')}</div><div style="height:12px"></div>${form('week-form','افزودن برنامه هفتگی',field('روز / تاریخ','day','text',{required:true,placeholder:'شنبه یا تاریخ'})+field('تمرکز اصلی','focus','text',{required:true,placeholder:'مثلاً پیشرفت شغلی'})+field('وضعیت','status','select',{options:[['برنامه‌ریزی شده','برنامه‌ریزی شده'],['در حال انجام','در حال انجام'],['انجام شد','انجام شد'],['انتقال به هفته بعد','انتقال به هفته بعد']]})+field('نتیجه مورد انتظار','result','textarea',{full:true}))}`}
function moneyPage(){let inc=db.money.filter(m=>m.type==='in').reduce((a,m)=>a+m.amount,0),out=db.money.filter(m=>m.type==='out').reduce((a,m)=>a+m.amount,0);return `<div class="grid">${stat('مجموع درآمد',money(inc),'همه رکوردها')}${stat('مجموع هزینه',money(out),'همه رکوردها')}${stat('مانده خالص',money(inc-out),'درآمد منهای هزینه')}${stat('تعداد تراکنش‌ها',db.money.length,'تراکنش ثبت‌شده')}</div><div class="section-title">تراکنش‌ها</div><div class="card">${db.money.length?db.money.slice().reverse().map(m=>`<div class="item"><div class="row"><strong>${esc(m.title)}</strong><strong style="color:${m.type==='in'?'var(--accent)':'var(--danger)'}">${m.type==='in'?'+':'−'}${money(m.amount)}</strong></div><div class="small">${esc(m.date)} · ${esc(m.category)} · ${m.type==='in'?'درآمد':'هزینه'}</div><div class="actions"><button data-money-delete="${m.id}">حذف تراکنش</button></div></div>`).join(''):empty('اولین درآمد یا هزینه را ثبت کن.')}</div><div style="height:12px"></div>${form('money-form','ثبت تراکنش',field('نوع تراکنش','type','select',{options:[['out','هزینه'],['in','درآمد']]})+field('مبلغ','amount','number',{required:true,min:0,step:'any',placeholder:'مثلاً 250000'})+field('عنوان','title','text',{required:true,placeholder:'خرید، حقوق، قبض...'})+field('تاریخ','date','date',{value:todayISO(),required:true})+field('دسته‌بندی','category','select',{options:[['خوراک','خوراک'],['مسکن','مسکن'],['حمل‌ونقل','حمل‌ونقل'],['سلامت','سلامت'],['خرید','خرید'],['قبض و اشتراک','قبض و اشتراک'],['تفریح','تفریح'],['آموزش','آموزش'],['پس‌انداز','پس‌انداز'],['حقوق','حقوق'],['درآمد جانبی','درآمد جانبی'],['سایر','سایر']]})+field('یادداشت','note','text',{placeholder:'اختیاری'}))}<div class="hint">این نسخه به حساب بانکی وصل نیست و تبدیل ارز انجام نمی‌دهد.</div>`}
function goalsPage(){return `<div class="card"><div class="section-title" style="margin-top:0">اهداف من</div>${db.goals.length?db.goals.map(g=>`<div class="item"><div class="row"><strong>${esc(g.title)}</strong>${badge(g.status)}</div><div class="small">${esc(g.deadline||'بدون موعد')} · ${esc(g.metric||'بدون معیار')}</div><div class="row" style="margin-top:10px"><span class="muted">پیشرفت</span><strong>${g.progress}%</strong></div><div class="progress"><span style="width:${g.progress}%"></span></div>${g.next?`<div class="small" style="margin-top:7px">قدم بعدی: ${esc(g.next)}</div>`:''}<div class="actions"><button data-goal-progress="${g.id}">+۱۰٪ پیشرفت</button><button data-goal-delete="${g.id}">حذف</button></div></div>`).join(''):empty('هدف را قابل اندازه‌گیری تعریف کن.')}</div><div style="height:12px"></div>${form('goal-form','تعریف هدف جدید',field('عنوان هدف','title','text',{required:true,placeholder:'مثلاً یادگیری مهارت جدید'})+field('موعد هدف','deadline','date')+field('معیار موفقیت','metric','text',{placeholder:'چطور اندازه می‌گیری؟'})+field('پیشرفت اولیه (%)','progress','number',{min:0,step:1,value:'0'})+field('قدم بعدی','next','textarea',{full:true}))}`}
function reviewPage(){return `${form('review-form','مرور هفتگی',field('هفته / تاریخ','week','text',{required:true,placeholder:'مثلاً هفته اول آبان'})+field('مهم‌ترین موفقیت','win','textarea',{full:true})+field('چالش اصلی','challenge','textarea',{full:true})+field('درس هفته','lesson','textarea',{full:true})+field('اولویت هفته بعد','next','textarea',{full:true}),'ثبت مرور هفته')}<div class="section-title">مرورهای قبلی</div><div class="card">${db.reviews.length?db.reviews.slice().reverse().map(r=>`<div class="item"><strong>${esc(r.week)}</strong><div class="small">موفقیت: ${esc(r.win||'—')}<br>چالش: ${esc(r.challenge||'—')}<br>درس: ${esc(r.lesson||'—')}<br>اولویت بعد: ${esc(r.next||'—')}</div><div class="actions"><button data-review-delete="${r.id}">حذف</button></div></div>`).join(''):empty('پایان هفته چند دقیقه برای مرور وقت بگذار.')}</div>`}
function dataPage(){return `<div class="card"><div class="section-title" style="margin-top:0">پشتیبان‌گیری و بازیابی</div><p class="small">برای انتقال اطلاعات یا نگهداری نسخه امن، خروجی JSON بگیر و در محل امن نگه دار.</p><button class="btn fullbtn" id="export">دریافت نسخه پشتیبان</button><div style="height:14px"></div><label for="import-file">بازیابی از فایل JSON این پلنر</label><input id="import-file" type="file" accept=".json,application/json" style="margin-top:7px"><button class="btn secondary fullbtn" id="import">بازیابی فایل انتخاب‌شده</button><div class="hint">بازیابی اطلاعات فعلی را جایگزین می‌کند. ابتدا نسخه فعلی را ذخیره کن.</div><div class="section-title">پاک‌سازی اطلاعات</div><button class="btn danger fullbtn" id="clear">حذف همه اطلاعات</button></div>`}
const pages={home,tasks:tasksPage,habits:habitsPage,week:weekPage,money:moneyPage,goals:goalsPage,review:reviewPage,data:dataPage};
function render(){$('#content').innerHTML=(pages[page]||home)()+`<div class="notice" role="status">${esc(notice)}</div>`;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b){page=b.dataset.page;notice='';render()}});
$('#content').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.go){page=b.dataset.go;render();return}
if(b.dataset.taskEdit){let t=db.tasks.find(x=>x.id===b.dataset.taskEdit),v=prompt('عنوان کار',t.title);if(v!==null&&v.trim()){t.title=v.trim();save();render()}}
for(let [attr,key] of [['taskDelete','tasks'],['habitDelete','habits'],['weekDelete','weeks'],['moneyDelete','money'],['goalDelete','goals'],['reviewDelete','reviews']])if(b.dataset[attr]){db[key]=db[key].filter(x=>x.id!==b.dataset[attr]);save();render()}
if(b.dataset.goalProgress){let g=db.goals.find(x=>x.id===b.dataset.goalProgress);g.progress=Math.min(100,Number(g.progress)+10);if(g.progress===100)g.status='تکمیل شد';save();render()}
if(b.id==='export'){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='personal-planner-backup.json';a.click();URL.revokeObjectURL(url);notice='نسخه پشتیبان آماده شد.';render()}
if(b.id==='import'){let f=$('#import-file').files[0];if(!f){notice='ابتدا فایل JSON را انتخاب کن.';render();return}let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);for(let k of Object.keys(fresh()))if(!Array.isArray(x[k]))throw Error();if(confirm('اطلاعات فعلی با فایل جایگزین شود؟')){db=x;save();page='home';render()}}catch(e){notice='فایل معتبر این پلنر نیست.';render()}};r.readAsText(f)}
if(b.id==='clear'&&confirm('همه اطلاعات پلنر حذف شود؟')){db=fresh();save();render()}
});
$('#content').addEventListener('change',e=>{let t=e.target;if(t.dataset.taskCheck){let x=db.tasks.find(v=>v.id===t.dataset.taskCheck);if(x)x.status=t.checked?'done':'todo';save();render()}if(t.dataset.habitCheck){let x=db.habits.find(v=>v.id===t.dataset.habitCheck);if(x)x.done=t.checked;save();render()}if(t.id==='task-filter'){filter=t.value;render()}});
$('#content').addEventListener('submit',e=>{e.preventDefault();let f=e.target,v=Object.fromEntries(new FormData(f).entries());if(f.id==='task-form')db.tasks.push({id:uid(),title:v.title.trim(),date:v.date,area:v.area,priority:v.priority,status:v.status,note:v.note});else if(f.id==='habit-form')db.habits.push({id:uid(),name:v.name.trim(),target:v.target,note:v.note,date:todayISO(),done:false});else if(f.id==='week-form')db.weeks.push({id:uid(),day:v.day,focus:v.focus,status:v.status,result:v.result});else if(f.id==='money-form'){let n=Number(v.amount);if(!Number.isFinite(n)||n<0){notice='مبلغ معتبر وارد کن.';render();return}db.money.push({id:uid(),type:v.type,amount:n,title:v.title.trim(),date:v.date,category:v.category,note:v.note})}else if(f.id==='goal-form'){let n=Math.max(0,Math.min(100,Number(v.progress)||0));db.goals.push({id:uid(),title:v.title.trim(),deadline:v.deadline,metric:v.metric,progress:n,status:n>=100?'تکمیل شد':'فعال',next:v.next})}else if(f.id==='review-form')db.reviews.push({id:uid(),...v});save();render()});
let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('#installBtn').classList.add('show')});$('#installBtn').addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('#installBtn').classList.remove('show')}else alert('از منوی سه‌نقطه مرورگر، گزینه Add to Home screen یا افزودن به صفحه اصلی را انتخاب کن.')});
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
})();
</script>
</body></html>
